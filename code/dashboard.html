<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sortation Conveyor - Control Room (v2)</title>

<!-- mqtt.js over WebSockets - the only external dependency (same as v1) -->
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<!--
  This is an ALTERNATE look for the same dashboard. The data path is identical
  to dashboard.html: it reads the PLC telemetry over MQTT and sends the same
  commands back. Only the appearance and a few interactive touches changed
  (animated gauges, count-up numbers, an event log, a light/dark switch).
-->

<style>
  :root {
    --bg-1:#0a121b; --bg-2:#0e1926;
    --panel:#111f2e; --panel-2:#16283a; --line:#213347;
    --text:#d7e6f2; --muted:#7f9bb0; --faint:#5a7387;
    --green:#2fd98a; --orange:#f5a524; --red:#ff5470; --blue:#39b7ff;
    --violet:#9b8cff; --cyan:#2fe0d0; --accent:#26e0c2; --accent-2:#39b7ff;
    --shadow:0 10px 30px rgba(0,0,0,.35);
    --radius:14px;
  }
  /* light theme overrides */
  body.light {
    --bg-1:#eef3f7; --bg-2:#e4edf3;
    --panel:#ffffff; --panel-2:#f2f7fb; --line:#d6e1ea;
    --text:#1a2b3a; --muted:#587085; --faint:#8aa0b2;
    --shadow:0 8px 24px rgba(30,60,90,.12);
  }

  * { box-sizing:border-box; margin:0; padding:0; }

  body {
    font-family:"Segoe UI", Roboto, -apple-system, Arial, sans-serif;
    color:var(--text);
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(38,224,194,.10), transparent 60%),
      radial-gradient(1000px 500px at 0% 0%, rgba(57,183,255,.10), transparent 55%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    background-attachment:fixed;
    min-height:100vh;
    padding:18px;
    transition:background .4s, color .4s;
  }
  .num { font-family:"Consolas","SF Mono",monospace; font-variant-numeric:tabular-nums; }

  .wrap { max-width:1180px; margin:0 auto; }

  /* ---------- Top bar ---------- */
  .topbar {
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    flex-wrap:wrap;
    background:linear-gradient(120deg, var(--panel), var(--panel-2));
    border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 20px; box-shadow:var(--shadow); margin-bottom:16px;
  }
  .brand { display:flex; align-items:center; gap:14px; }
  .logo {
    width:44px; height:44px; border-radius:12px; flex:none; position:relative;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow:0 0 18px rgba(38,224,194,.45);
  }
  .logo::before, .logo::after {
    content:""; position:absolute; background:#06131c; border-radius:2px;
  }
  .logo::before { left:9px; right:9px; top:20px; height:4px; }
  .logo::after  { left:14px; width:6px; height:6px; top:19px; border-radius:50%;
                  box-shadow:9px 0 0 #06131c, 18px 0 0 #06131c; }
  .brand h1 { font-size:18px; letter-spacing:.3px; }
  .brand .sub { color:var(--muted); font-size:11.5px; margin-top:3px; }

  .toolbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .conn-pill {
    display:flex; align-items:center; gap:8px; font-size:12.5px;
    background:var(--panel-2); border:1px solid var(--line);
    padding:7px 12px; border-radius:999px;
  }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--red); position:relative; }
  .dot.on { background:var(--green); }
  .dot.on::after {
    content:""; position:absolute; inset:-4px; border-radius:50%;
    border:2px solid var(--green); opacity:.6; animation:ping 1.6s ease-out infinite;
  }
  @keyframes ping { 0%{transform:scale(.6);opacity:.7;} 100%{transform:scale(1.8);opacity:0;} }

  .field { display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); }
  .field input {
    background:var(--bg-1); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:7px 10px; font-size:12.5px; width:110px;
  }
  .field input:focus { outline:none; border-color:var(--accent); }
  .btn {
    background:var(--panel-2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:8px 14px; font-size:12.5px; font-weight:600;
    cursor:pointer; transition:transform .08s, border-color .2s, background .2s;
  }
  .btn:hover { border-color:var(--accent); }
  .btn:active { transform:translateY(1px) scale(.98); }
  .icon-btn { width:38px; height:38px; padding:0; font-size:16px; }

  /* ---------- Grid helpers ---------- */
  .grid { display:grid; gap:14px; }
  .kpis { grid-template-columns:repeat(5,1fr); }
  .mid  { grid-template-columns:1.15fr 1.15fr 1.4fr 1fr; }
  .status4 { grid-template-columns:repeat(4,1fr); }
  @media (max-width:1000px){ .kpis{grid-template-columns:repeat(3,1fr);} .mid{grid-template-columns:1fr 1fr;} .status4{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:620px){ .kpis{grid-template-columns:repeat(2,1fr);} .mid{grid-template-columns:1fr;} }

  .card {
    background:linear-gradient(160deg, var(--panel), var(--panel-2));
    border:1px solid var(--line); border-radius:var(--radius);
    padding:15px 16px; box-shadow:var(--shadow);
    transition:transform .15s, border-color .2s;
  }
  .card:hover { transform:translateY(-2px); border-color:var(--line); }
  .kpi { position:relative; overflow:hidden; }
  .kpi .k { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:1px; }
  .kpi .v { font-size:40px; font-weight:800; margin-top:6px; line-height:1; }
  .kpi .bar { height:4px; border-radius:4px; margin-top:12px; background:var(--line); overflow:hidden; }
  .kpi .bar > i { display:block; height:100%; width:35%; border-radius:4px; transition:width .5s ease; }
  .kpi.total .accent { color:var(--violet); } .kpi.total .bar>i{ background:var(--violet); }
  .kpi.l1 .accent { color:var(--green); }     .kpi.l1 .bar>i{ background:var(--green); }
  .kpi.l2 .accent { color:var(--orange); }    .kpi.l2 .bar>i{ background:var(--orange); }
  .kpi.l3 .accent { color:var(--blue); }       .kpi.l3 .bar>i{ background:var(--blue); }
  .kpi.rej .accent { color:var(--red); }        .kpi.rej .bar>i{ background:var(--red); }
  .kpi .tag { position:absolute; top:14px; right:14px; font-size:10px; color:var(--faint);
              border:1px solid var(--line); border-radius:6px; padding:2px 6px; }

  .card h2, .card h3 { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }

  .gauge-wrap { display:flex; flex-direction:column; align-items:center; }
  .gauge-cv { width:150px; height:120px; }
  .gauge-label { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:1px; margin-top:2px; }

  .mode-card { display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
  .mode-pill {
    font-size:26px; font-weight:800; letter-spacing:1px; padding:8px 22px; border-radius:12px;
    border:1px solid var(--line); transition:all .3s;
  }
  .mode-STOP   { color:var(--muted);  background:rgba(127,155,176,.10); }
  .mode-AUTO   { color:var(--green);  background:rgba(47,217,138,.12); box-shadow:0 0 22px rgba(47,217,138,.25); }
  .mode-MANUAL { color:var(--orange); background:rgba(245,165,36,.12); }
  .mode-FAULT  { color:var(--red);    background:rgba(255,84,112,.14); box-shadow:0 0 22px rgba(255,84,112,.30); animation:blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity:.55; } }
  .mode-sub { color:var(--muted); font-size:11px; margin-top:10px; }
  .throughput-big { font-size:34px; font-weight:800; }
  .throughput-unit { font-size:13px; color:var(--muted); font-weight:600; }
  #tpSpark { width:100%; height:44px; margin-top:8px; display:block; }

  /* ---------- status lamps ---------- */
  .lamp {
    display:flex; align-items:center; gap:12px;
  }
  .lamp .ring {
    width:34px; height:34px; border-radius:50%; flex:none; position:relative;
    border:3px solid var(--line);
  }
  .lamp .ring::after { content:""; position:absolute; inset:6px; border-radius:50%; background:var(--faint); transition:all .3s; }
  .lamp.ok   .ring{ border-color:rgba(47,217,138,.4);} .lamp.ok   .ring::after{ background:var(--green); box-shadow:0 0 12px var(--green);}
  .lamp.warn .ring{ border-color:rgba(245,165,36,.4);} .lamp.warn .ring::after{ background:var(--orange); box-shadow:0 0 12px var(--orange);}
  .lamp.bad  .ring{ border-color:rgba(255,84,112,.4);} .lamp.bad  .ring::after{ background:var(--red); box-shadow:0 0 12px var(--red); animation:blink 1s step-end infinite;}
  .lamp .lk { font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
  .lamp .lv { font-size:15px; font-weight:700; margin-top:2px; }

  /* ---------- twin ---------- */
  #twin { width:100%; height:auto; display:block; background:
      radial-gradient(600px 200px at 50% 0%, rgba(57,183,255,.06), transparent 70%), #0a1420;
      border:1px solid var(--line); border-radius:10px; }
  body.light #twin { background:#eaf1f7; }
  .hint { color:var(--muted); font-size:11px; margin-top:10px; line-height:1.5; }

  /* ---------- controls ---------- */
  .controls { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .cbtn { display:flex; align-items:center; gap:8px; padding:11px 18px; font-size:13.5px; font-weight:700; }
  .cbtn .i { font-size:15px; }
  .c-start { border-color:rgba(47,217,138,.5); color:var(--green); }
  .c-stop  { border-color:rgba(245,165,36,.5); color:var(--orange); }
  .c-reset { border-color:rgba(57,183,255,.5); color:var(--blue); }
  .c-auto, .c-manual { color:var(--text); }
  .divider { width:1px; height:30px; background:var(--line); }

  /* toggle switch */
  .switch { display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none; }
  .switch .track {
    width:52px; height:28px; border-radius:999px; background:var(--line); position:relative; transition:background .25s;
  }
  .switch .track > i {
    position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%;
    background:#fff; transition:left .25s; box-shadow:0 1px 3px rgba(0,0,0,.4);
  }
  .switch.on .track { background:var(--green); }
  .switch.on .track > i { left:27px; }
  .switch .sl { font-size:12.5px; color:var(--muted); font-weight:600; }

  /* ---------- alarm banner ---------- */
